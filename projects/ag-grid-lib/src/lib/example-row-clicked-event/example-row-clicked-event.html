<h3>Grid Events Example (Check Console for Output)</h3>
<ag-grid-angular style="width: 100%; height: 500px;" class="ag-theme-alpine" [columnDefs]="columnDefs"
    [rowData]="rowData" (rowClicked)="onRowClicked($event)"
    (rowDoubleClicked)="onRowDoubleClicked($event)"></ag-grid-angular>
@if (popupMessage) {
<div style="padding: 10px; border: 1px solid #ccc; background-color: #f9f9f9; margin-top: 10px;">
    {{ popupMessage }}
</div>
}
